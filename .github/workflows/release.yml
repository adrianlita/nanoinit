name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s test -p 'test_*.py'

      - name: Build Ubuntu binary
        run: |
          mkdir -p dist/ubuntu
          docker build --pull -t nanoinit-builder-ubuntu -f deploy/Dockerfile.ubuntu .
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/dist/ubuntu:/opt/release" nanoinit-builder-ubuntu
          mv dist/ubuntu/nanoinit dist/nanoinit-ubuntu

      - name: Build Alpine binary
        run: |
          mkdir -p dist/alpine
          docker build --pull -t nanoinit-builder-alpine -f deploy/Dockerfile.alpine .
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/dist/alpine:/opt/release" nanoinit-builder-alpine
          mv dist/alpine/nanoinit dist/nanoinit-alpine

      - name: Prepare release assets
        run: |
          chmod +x dist/nanoinit-ubuntu dist/nanoinit-alpine
          sha256sum dist/nanoinit-ubuntu dist/nanoinit-alpine > dist/SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nanoinit-release-binaries
          path: |
            dist/nanoinit-ubuntu
            dist/nanoinit-alpine
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nanoinit-ubuntu \
            dist/nanoinit-alpine \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes
