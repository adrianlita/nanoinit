name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s test -p 'test_*.py'
